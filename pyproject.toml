[project]
name = "charter-hunter"
version = "0.1.0"
description = "Ежедневный дайджест чартерных билетов из Telegram-каналов"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "qrcode>=7.4",
]

[project.scripts]
hunter = "charter_hunter.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
